
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My iPhone</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: #171719;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
.phone {
  width: min(100vw, 390px);
  height: min(844px, 100dvh);
  min-height: 600px;
  position: relative;
  overflow: hidden;
  background: #101116;
  border: 5px solid #353539;
  border-radius: 48px;
  box-shadow: 0 20px 70px #0009;
}
.wallpaper {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 25% 30%, #5c637c 0, transparent 35%),
    radial-gradient(ellipse at 80% 65%, #343b58 0, transparent 40%),
    linear-gradient(145deg, #171a27, #08090e 75%);
}
.status {
  position: absolute;
  z-index: 5;
  top: 15px;
  left: 25px;
  right: 25px;
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
}
.island {
  position: absolute;
  z-index: 6;
  width: 105px;
  height: 29px;
  top: 9px;
  left: 50%;
  transform: translateX(-50%);
  background: #000;
  border-radius: 22px;
}
.screen { position: absolute; inset: 0; display: none; }
.screen.active { display: block; }
.lock-content {
  position: absolute;
  top: 17%;
  width: 100%;
  text-align: center;
}
.date { font-size: 17px; color: #eee; }
.clock { font-size: 76px; font-weight: 300; letter-spacing: -4px; }
.unlock-hint {
  position: absolute;
  bottom: 100px;
  width: 100%;
  text-align: center;
  color: #eee;
  font-size: 14px;
}
.lock-bottom {
  position: absolute;
  bottom: 25px;
  left: 28px;
  right: 28px;
  display: flex;
  justify-content: space-between;
}
.circle {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #ffffff25;
  display: grid;
  place-items: center;
  font-size: 21px;
  backdrop-filter: blur(10px);
}
.home-content {
  position: absolute;
  inset: 65px 18px 28px;
}
.welcome { font-size: 14px; color: #ddd; margin-bottom: 24px; }
.apps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 25px 12px;
}
.app {
  text-align: center;
  cursor: pointer;
  font-size: 11px;
}
.app-icon {
  width: 57px;
  height: 57px;
  border-radius: 16px;
  margin: 0 auto 7px;
  display: grid;
  place-items: center;
  font-size: 27px;
  box-shadow: inset 0 1px 1px #ffffff40;
}
.messages { background: linear-gradient(#5ee783, #13a84b); }
.photos { background: conic-gradient(#fbd34d, #f37a69, #c77cff, #57b9ff, #fbd34d); }
.notes { background: linear-gradient(#fff 0 25%, #ffe889 25%); color: #222; }
.settings { background: linear-gradient(#777, #343438); }
.camera { background: linear-gradient(#555, #151515); }
.safari { background: linear-gradient(#72dcff, #2773e7); }
.dock {
  position: absolute;
  bottom: 12px;
  left: 10px;
  right: 10px;
  height: 83px;
  border-radius: 27px;
  background: #ffffff24;
  backdrop-filter: blur(22px);
  display: flex;
  align-items: center;
  justify-content: space-evenly;
}
.dock .app-icon { margin: 0; width: 53px; height: 53px; }
.app-screen {
  position: absolute;
  inset: 0;
  background: #f5f5f7;
  color: #171719;
  padding: 65px 22px 30px;
}
.app-screen h2 { font-size: 28px; margin: 14px 0 25px; }
.back {
  border: 0;
  background: #e7e7eb;
  color: #287aff;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 15px;
}
.panel {
  background: white;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  font-size: 15px;
}
.panel input, .panel textarea {
  width: 100%;
  border: 0;
  outline: 0;
  font: inherit;
  resize: vertical;
}
.panel textarea { min-height: 220px; }
.dark-app { background: #171719; color: white; }
.dark-app .panel { background: #2b2b30; }
.dark-app .back { background: #333338; }
.pin-screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: #101116ee;
  backdrop-filter: blur(25px);
  display: none;
  text-align: center;
  padding: 130px 25px 25px;
}
.pin-screen.show { display: block; }
.pin-dots { font-size: 28px; letter-spacing: 14px; margin: 28px 0; }
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 280px;
  margin: 0 auto;
}
.key {
  width: 72px;
  height: 62px;
  border: 0;
  border-radius: 50%;
  background: #ffffff20;
  color: white;
  font-size: 25px;
  justify-self: center;
}
.key:active { background: #ffffff50; }
.home-bar {
  position: absolute;
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 4px;
  background: white;
  border-radius: 10px;
  z-index: 20;
}
@media (max-height: 650px) {
  .phone { min-height: 0; height: 100dvh; border-radius: 25px; }
  .lock-content { top: 14%; }
  .clock { font-size: 62px; }
  .apps { gap: 14px 10px; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="wallpaper"></div>
  <div class="island"></div>
  <div class="status">
    <span id="statusTime">9:41</span>
    <span>●●●　 Wi-Fi　 ▰</span>
  </div>

  <section id="lock" class="screen active">
    <div class="lock-content">
      <div class="date" id="date">10월 18일 일요일</div>
      <div class="clock" id="clock">9:41</div>
    </div>
    <div class="unlock-hint">위로 쓸어올려 열기 ↑</div>
    <div class="lock-bottom">
      <div class="circle">◉</div>
      <div class="circle">◎</div>
    </div>
  </section>

  <section id="home" class="screen">
    <div class="home-content">
      <div class="welcome">오늘도 좋은 하루 ☁️</div>
      <div class="apps">
        <div class="app" onclick="openApp('messages')"><div class="app-icon messages">☎</div>전화</div>
        <div class="app" onclick="openApp('photos')"><div class="app-icon photos">🌈</div>사진</div>
        <div class="app" onclick="openApp('notes')"><div class="app-icon notes">📝</div>메모</div>
        <div class="app" onclick="openApp('settings')"><div class="app-icon settings">⚙</div>설정</div>
        <div class="app" onclick="openApp('messages')"><div class="app-icon messages">●</div>메시지</div>
        <div class="app" onclick="openApp('safari')"><div class="app-icon safari">🧭</div>Safari</div>
        <div class="app" onclick="openApp('camera')"><div class="app-icon camera">📷</div>카메라</div>
        <div class="app" onclick="openApp('profile')"><div class="app-icon" style="background:#bd9acb">♡</div>프로필</div>
      </div>
    </div>
    <div class="dock">
      <div class="app" onclick="openApp('messages')"><div class="app-icon messages">☎</div></div>
      <div class="app" onclick="openApp('photos')"><div class="app-icon photos">🌈</div></div>
      <div class="app" onclick="openApp('safari')"><div class="app-icon safari">🧭</div></div>
      <div class="app" onclick="openApp('settings')"><div class="app-icon settings">⚙</div></div>
    </div>
  </section>

  <section id="app" class="screen">
    <div class="app-screen" id="appContent"></div>
  </section>

  <section id="pin" class="pin-screen">
    <div style="font-size:42px">🔒</div>
    <h2>암호 입력</h2>
    <div style="color:#ddd;font-size:14px">iPhone을 잠금 해제하려면 암호를 입력하십시오</div>
    <div id="dots" class="pin-dots">○ ○ ○ ○</div>
    <div class="keypad">
      <button class="key" onclick="pressPin('1')">1</button>
      <button class="key" onclick="pressPin('2')">2</button>
      <button class="key" onclick="pressPin('3')">3</button>
      <button class="key" onclick="pressPin('4')">4</button>
      <button class="key" onclick="pressPin('5')">5</button>
      <button class="key" onclick="pressPin('6')">6</button>
      <button class="key" onclick="pressPin('7')">7</button>
      <button class="key" onclick="pressPin('8')">8</button>
      <button class="key" onclick="pressPin('9')">9</button>
      <button class="key" onclick="pressPin('clear')">⌫</button>
      <button class="key" onclick="pressPin('0')">0</button>
      <button class="key" onclick="cancelPin()">취소</button>
    </div>
  </section>
  <div class="home-bar" id="homeBar"></div>
</div>

<script>
let pin = "";
let savedPin = "1234";
let notesText = localStorage.getItem("characterNotes") || "";
let messageText = localStorage.getItem("characterMessages") || "";

function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString("ko-KR", {
    hour: "numeric", minute: "2-digit", hour12: false
  });
  document.getElementById("clock").textContent = time;
  document.getElementById("statusTime").textContent = time;
  document.getElementById("date").textContent =
    now.toLocaleDateString("ko-KR", { month: "long", day: "numeric", weekday: "long" });
}
updateClock();
setInterval(updateClock, 1000);

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function unlock() {
  document.getElementById("pin").classList.remove("show");
  showScreen("home");
}
function pressPin(key) {
  if (key === "clear") pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += key;
  document.getElementById("dots").textContent =
    Array.from({length: 4}, (_, i) => i < pin.length ? "●" : "○").join(" ");
  if (pin.length === 4) {
    if (pin === savedPin) {
      setTimeout(() => { pin = ""; unlock(); }, 180);
    } else {
      setTimeout(() => {
        pin = "";
        document.getElementById("dots").textContent = "○ ○ ○ ○";
        alert("암호가 올바르지 않습니다. 기본 암호는 1234예요!");
      }, 180);
    }
  }
}
function cancelPin() {
  pin = "";
  document.getElementById("pin").classList.remove("show");
}
let touchStart = 0;
document.getElementById("lock").addEventListener("touchstart", e => {
  touchStart = e.touches[0].clientY;
});
document.getElementById("lock").addEventListener("touchend", e => {
  if (touchStart - e.changedTouches[0].clientY > 35) {
    document.getElementById("pin").classList.add("show");
  }
});
document.getElementById("lock").addEventListener("click", () => {
  document.getElementById("pin").classList.add("show");
});

function openApp(name) {
  const content = document.getElementById("appContent");
  content.className = "app-screen" + (name === "settings" ? " dark-app" : "");
  const pages = {
    messages: `<button class="back" onclick="goHome()">‹ 홈</button>
      <h2>메시지</h2>
      <div class="panel">💬 대화</div>
      <div class="panel"><textarea id="messageInput" placeholder="메시지를 적어 봐...">${escapeText(messageText)}</textarea>
      <button class="back" onclick="saveMessages()">저장</button></div>`,
    photos: `<button class="back" onclick="goHome()">‹ 홈</button>
      <h2>사진</h2>
      <div class="panel">사진 보관함</div>
      <div class="panel" style="text-align:center;padding:40px 12px">🌄<p>나만의 사진 공간</p><p style="font-size:13px;color:#777">사진 추가 기능은 다음 단계에서 만들자!</p></div>`,
    notes: `<button class="back" onclick="goHome()">‹ 홈</button>
      <h2>메모</h2>
      <div class="panel"><textarea id="noteInput" placeholder="여기에 메모를 적어 줘...">${escapeText(notesText)}</textarea>
      <button class="back" onclick="saveNotes()">완료 · 저장</button></div>`,
    settings: `<button class="back" onclick="goHome()">‹ 홈</button>
      <h2>설정</h2>
      <div class="panel">📱 나의 iPhone</div>
      <div class="panel">🔐 잠금 비밀번호 변경
      <input id="newPin" inputmode="numeric" maxlength="4" placeholder="새 숫자 4자리">
      <button class="back" onclick="changePin()">변경하기</button></div>`,
    safari: `<button class="back" onclick="goHome()">‹ 홈</button>
      <h2>Safari</h2><div class="panel">검색</div>
      <div class="panel"><input id="searchInput" placeholder="검색어 또는 웹사이트"></div>
      <button class="back" onclick="searchWeb()">검색하기</button>`,
    camera: `<button class="back" onclick="goHome()">‹ 홈</button>
      <h2>카메라</h2><div class="panel">📷 카메라 화면 연출</div>
      <div class="panel">실제 카메라 촬영은 아직 지원하지 않아.</div>`,
    profile: `<button class="back" onclick="goHome()">‹ 홈</button>
      <h2>프로필</h2><div class="panel">♡ 캐릭터 이름</div>
      <div class="panel"><input id="profileName" placeholder="이름을 입력해 줘"></div>
      <div class="panel"><textarea id="profileBio" placeholder="소개를 적어 줘"></textarea></div>
      <button class="back" onclick="saveProfile()">저장</button>`
  };
  content.innerHTML = pages[name] || pages.profile;
  showScreen("app");
}
function goHome() { showScreen("home"); }
function escapeText(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function saveNotes() {
  notesText = document.getElementById("noteInput").value;
  localStorage.setItem("characterNotes", notesText);
  alert("메모를 저장했어!");
}
function saveMessages() {
  messageText = document.getElementById("messageInput").value;
  localStorage.setItem("characterMessages", messageText);
  alert("저장했어!");
}
function changePin() {
  const next = document.getElementById("newPin").value;
  if (!/^\d{4}$/.test(next)) return alert("숫자 4자리를 입력해 줘!");
  savedPin = next;
  alert("비밀번호를 바꿨어! 현재 화면에서만 유지돼.");
}
function searchWeb() {
  const q = document.getElementById("searchInput").value.trim();
  if (q) window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
}
function saveProfile() {
  localStorage.setItem("characterProfileName", document.getElementById("profileName").value);
  localStorage.setItem("characterProfileBio", document.getElementById("profileBio").value);
  alert("프로필 저장 기능은 다음 단계에서 더 완성하자!");
}
</script>
</body>
</html>
